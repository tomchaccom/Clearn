name: Auto Release PR

on:
  push:
    branches:
      - develop

jobs:
  create-release-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 버전 추출
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: 기존 릴리즈 PR 확인
        id: check_pr
        run: |
          PR=$(gh pr list --base main --head develop --json number --jq '.[0].number' 2>/dev/null || echo "")
          echo "pr_number=$PR" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 릴리즈 PR 생성 (없을 때만)
        if: steps.check_pr.outputs.pr_number == ''
        run: |
          CHANGELOG=$(git log origin/main..HEAD --oneline --no-merges | head -20)
          gh pr create \
            --base main \
            --head develop \
            --title "release: v${{ steps.version.outputs.version }}" \
            --body "$(printf '## 릴리즈 v%s\n\ndevelop → main 자동 릴리즈 PR\n\n### 변경사항\n\n```\n%s\n```\n\n---\n자동 생성됨' '${{ steps.version.outputs.version }}' "$CHANGELOG")"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
