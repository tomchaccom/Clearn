name: Auto Release PR

on:
  push:
    branches:
      - develop

jobs:
  create-release-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 버전 추출
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: 기존 릴리즈 PR 확인
        id: check_pr
        run: |
          PR=$(gh pr list --base main --head develop --json number --jq '.[0].number' 2>/dev/null || echo "")
          echo "pr_number=$PR" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 릴리즈 PR 생성 (없을 때만)
        if: steps.check_pr.outputs.pr_number == ''
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          MERGED_PRS=$(gh pr list \
            --state merged --base develop --limit 30 \
            --json number,title \
            --jq '.[] | "- #\(.number) \(.title)"' 2>/dev/null || echo "(PR 정보 없음)")

          COMMITS=$(git log origin/main..HEAD --oneline --no-merges | head -20)
          FILES_CHANGED=$(git diff --stat origin/main..HEAD | tail -1 | xargs)

          gh pr create \
            --base main \
            --head develop \
            --title "release: v${VERSION}" \
            --body "## 릴리즈 v${VERSION}

          develop → main 자동 릴리즈 PR

          ---

          ### 📦 포함된 PR

          ${MERGED_PRS}

          ---

          ### 📝 커밋 요약

          \`\`\`
          ${COMMITS}
          \`\`\`

          변경 규모: ${FILES_CHANGED}

          ---

          ### ✅ 릴리즈 체크리스트

          - [ ] E2E 테스트 통과 확인
          - [ ] 주요 기능 수동 스모크 테스트
          - [ ] 릴리즈 노트 작성 (GitHub Releases draft 보완)
          - [ ] 머지 후 develop 버전 bump

          ---

          ### 🔧 머지 후 자동 실행

          1. \`release.yml\` → macOS 빌드 → \`.dmg\` draft 업로드
          2. GitHub Releases에서 draft 확인 → 릴리즈 노트 보완 → publish

          ---
          *자동 생성됨 by Auto Release PR workflow*"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
